project:
  name: "SecureNet: AI-Based Network Intrusion Detection and Cyber Threat Intelligence System"
  version: "1.0.0"
  author: "SecureNet Team"

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  sample_dir: "data/sample"
  label_column: "Label"
  benign_label: "BENIGN"

preprocessing:
  test_size: 0.20
  random_state: 42
  imputer_strategy: "median"

binary_model:
  name: "RandomForestClassifier"
  params:
    n_estimators: 100
    max_depth: 20
    min_samples_split: 5
    min_samples_leaf: 2
    random_state: 42
    n_jobs: -1
    class_weight: "balanced"

multiclass_model:
  name: "ExtraTreesClassifier"
  params:
    n_estimators: 100
    max_depth: 20
    min_samples_split: 5
    min_samples_leaf: 2
    random_state: 42
    n_jobs: -1
    class_weight: "balanced"

artifacts:
  models_dir: "artifacts/models"
  reports_dir: "artifacts/reports"

outputs:
  data_understanding_dir: "outputs/data_understanding"
  eda_dir: "outputs/eda"
  evaluation_dir: "outputs/evaluation"
  feature_importance_dir: "outputs/feature_importance"
